name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          bun add react-router-dom
          echo "Installed react-router-dom"

      - name: Build client SPA for GitHub Pages
        run: |
          set -ex
          # Create a minimal Vite config for client-only SPA build
          cat > vite.ghpages.config.ts << 'VITEEOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tsconfigPaths from "vite-tsconfig-paths";
          import tailwindcss from "@tailwindcss/vite";
          import path from "path";

          export default defineConfig({
            base: "/fontevita-vitality-hub/",
            plugins: [react(), tsconfigPaths(), tailwindcss()],
            resolve: {
              alias: {
                "@": path.resolve(__dirname, "./src"),
                "@tanstack/react-router": path.resolve(__dirname, "./src/__mocks__/tanstack-router.tsx"),
              },
            },
            build: {
              outDir: "dist-ghpages",
              rollupOptions: {
                input: "index.html",
              },
            },
          });
          VITEEOF

          # Create mock for @tanstack/react-router
          mkdir -p src/__mocks__
          cat > src/__mocks__/tanstack-router.tsx << 'MOCKEOF'
          import React from "react";
          import { Link as RRDLink } from "react-router-dom";

          function resolvePath(to: string, params?: Record<string, string>): string {
            if (!params) return to;
            let resolved = to;
            for (const [key, value] of Object.entries(params)) {
              resolved = resolved.replace(`$${key}`, value);
            }
            return resolved;
          }

          export function Link({ to, params, hash, children, ...rest }: any) {
            const href = resolvePath(to, params) + (hash ? `#${hash}` : "");
            return <RRDLink to={href} {...rest}>{children}</RRDLink>;
          }

          export function createFileRoute() {
            return { component: () => null, loader: () => null, head: () => ({}) };
          }
          export function createRootRouteWithContext() {
            return () => ({ component: () => null, head: () => ({}) });
          }
          export function notFound() { throw new Error("Not found"); }
          export const Outlet = () => null;
          export const HeadContent = () => null;
          export const Scripts = () => null;
          MOCKEOF

          # Create index.html entry point
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>FonteVita — витамины и БАДы для всей семьи</title>
