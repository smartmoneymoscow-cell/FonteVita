name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NITRO_PRESET: static
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with static preset
        run: bun run build
        env:
          NODE_ENV: production
          NITRO_PRESET: static

      - name: Prepare static output
        id: find
        run: |
          echo "=== Build output ==="
          if [ -d ".output/public" ]; then
            UPLOAD_DIR=".output/public"
          elif [ -d ".output/static" ]; then
            UPLOAD_DIR=".output/static"
          elif [ -d "dist" ]; then
            UPLOAD_DIR="dist"
          else
            echo "ERROR: No build output found!"
            find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -10
            exit 1
          fi

          echo "Upload dir: $UPLOAD_DIR"
          ls -la "$UPLOAD_DIR"

          # For SPA on GitHub Pages: copy index.html to 404.html
          if [ -f "$UPLOAD_DIR/index.html" ]; then
            cp "$UPLOAD_DIR/index.html" "$UPLOAD_DIR/404.html"
            echo "Created 404.html for SPA routing"
          else
            echo "WARNING: No index.html in $UPLOAD_DIR, searching..."
            INDEX=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -1)
            if [ -n "$INDEX" ]; then
              INDEX_DIR=$(dirname "$INDEX")
              echo "Found index.html at: $INDEX_DIR"
              cp "$INDEX" "$INDEX_DIR/404.html"
              UPLOAD_DIR="$INDEX_DIR"
            else
              echo "ERROR: No index.html found anywhere!"
              exit 1
            fi
          fi

          echo "upload_dir=$UPLOAD_DIR" >> $GITHUB_OUTPUT

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.upload_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
