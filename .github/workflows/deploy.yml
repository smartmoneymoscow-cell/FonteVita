name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Find build output
        id: find
        run: |
          echo "=== Looking for index.html ==="
          find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -20
          echo "=== .output ==="
          ls -la .output/ 2>/dev/null || echo "no .output"
          ls -laR .output/public/ 2>/dev/null || echo "no .output/public"
          echo "=== dist ==="
          ls -la dist/ 2>/dev/null || echo "no dist"
          # Determine upload dir
          if [ -d ".output/public" ]; then
            echo "upload_dir=.output/public" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "upload_dir=dist" >> $GITHUB_OUTPUT
          elif [ -d ".output/static" ]; then
            echo "upload_dir=.output/static" >> $GITHUB_OUTPUT
          else
            # Find dir containing index.html
            DIR=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
            echo "upload_dir=$DIR" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.upload_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
