                    <div className="relative mx-auto w-full max-w-4xl px-4 pb-8 pt-8 text-center sm:px-6 sm:pt-12">
                      <span className="mt-6 inline-flex items-center gap-2 rounded-full bg-card px-4 py-2 text-xs font-bold shadow-soft sm:text-sm"><Sparkles className="h-4 w-4 text-coral" />Блог FonteVita</span>
                      <h1 className="mt-5 text-4xl font-bold leading-[1.1] sm:text-5xl">Витамины и БАДы — простыми словами</h1>
                      <p className="mx-auto mt-4 max-w-2xl text-base leading-relaxed text-muted-foreground sm:text-lg">Разбираем коллаген, магний B6 и омега-3: как принимать, сочетать и выбирать.</p>
                    </div>
                  </section>
                  <section className="sticky top-16 z-20 border-b border-border bg-background/90 backdrop-blur-md">
                    <div className="mx-auto flex w-full max-w-4xl flex-col gap-3 px-4 py-4 sm:px-6">
                      <div className="relative">
                        <Search className="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />
                        <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Поиск по статьям..." className="w-full rounded-2xl border border-border bg-card py-3 pl-11 pr-10 text-sm outline-none transition-colors placeholder:text-muted-foreground focus:border-primary focus:ring-2 focus:ring-primary/20" />
                        {search && <button onClick={() => setSearch("")} className="absolute right-3 top-1/2 -translate-y-1/2 rounded-full p-1 text-muted-foreground hover:bg-secondary"><X className="h-4 w-4" /></button>}
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button onClick={() => setActiveCategory(null)} className={`shrink-0 rounded-full px-3.5 py-1.5 text-xs font-bold transition-all ${!activeCategory ? "bg-primary text-primary-foreground shadow-soft" : "bg-secondary text-muted-foreground hover:text-foreground"}`}>Все</button>
                        {blogCategories.map((c) => (<button key={c.slug} onClick={() => toggleCategory(c.slug)} className={`inline-flex shrink-0 items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-bold transition-all ${activeCategory === c.slug ? "bg-primary text-primary-foreground shadow-soft" : "bg-secondary text-muted-foreground hover:text-foreground"}`}><c.icon className="h-3.5 w-3.5" />{c.shortName}</button>))}
                      </div>
                    </div>
                  </section>
                  <section className="mx-auto w-full max-w-4xl px-4 py-8 sm:px-6 sm:py-12">
                    {filtered.length > 0 ? (
                      <div className="space-y-5">{filtered.map((post) => {
                        const category = getCategoryBySlug(post.categorySlug);
                        if (!category) return null;
                        return (
                          <article key={post.slug} className="soft-card flex flex-col overflow-hidden sm:flex-row">
                            <RRDLink to={`/blog/${post.slug}`} className="block shrink-0 sm:w-56 md:w-64" tabIndex={-1}><ArticleCover category={category} /></RRDLink>
                            <div className="flex flex-1 flex-col gap-2.5 p-5 sm:py-5 sm:pr-6">
                              <div className="flex flex-wrap items-center gap-2"><CategoryPill category={category} /><span className="text-xs font-bold text-muted-foreground">{formatDate(post.publishedAt)}</span><span className="flex items-center gap-1 text-xs font-bold text-muted-foreground"><Clock className="h-3 w-3" />{post.readingTime} мин</span></div>
                              <h3 className="text-lg font-bold leading-snug sm:text-xl"><RRDLink to={`/blog/${post.slug}`} className="transition-colors hover:text-primary">{post.title}</RRDLink></h3>
                              <p className="text-sm leading-relaxed text-muted-foreground">{post.excerpt}</p>
                              <RRDLink to={`/blog/${post.slug}`} className="mt-auto inline-flex w-fit items-center gap-1.5 pt-1 text-sm font-extrabold text-foreground transition-colors hover:text-primary">Читать →</RRDLink>
                            </div>
                          </article>
                        );
                      })}</div>
                    ) : (
                      <div className="flex flex-col items-center gap-4 py-16 text-center"><div className="flex h-16 w-16 items-center justify-center rounded-full bg-sun-soft"><Search className="h-7 w-7 text-muted-foreground" /></div><p className="text-lg font-bold">Ничего не найдено</p><p className="max-w-md text-sm text-muted-foreground">Попробуйте изменить запрос или выбрать другую категорию.</p></div>
                    )}
                  </section>
                </main>
                <SiteFooter />
              </div>
            );
          }

          function BlogCategoryPage() {
            const { category: catSlug } = useParams();
            const category = getCategoryBySlug(catSlug || "");
            const posts = category ? getPostsByCategory(category.slug) : [];
            if (!category) return <div className="p-20 text-center">Категория не найдена</div>;
            const otherCategories = blogCategories.filter((c) => c.slug !== category.slug);
            return (
              <div className="min-h-dvh overflow-x-hidden">
                <BlogHeader />
                <main>
                  <section className="relative overflow-hidden bg-gradient-to-b from-sand via-background to-background">
                    <div className="relative mx-auto w-full max-w-4xl px-4 pb-12 pt-8 text-center sm:px-6 sm:pt-12">
                      <span className="mt-6 inline-flex items-center gap-2 rounded-full bg-card px-4 py-2 text-xs font-bold shadow-soft sm:text-sm"><category.icon className="h-4 w-4" />Раздел блога</span>
                      <h1 className="mt-5 text-4xl font-bold leading-[1.1] sm:text-5xl">{category.name}</h1>
                      <p className="mx-auto mt-5 max-w-2xl text-base leading-relaxed text-muted-foreground sm:text-lg">{category.description}</p>
                      <div className="mt-8 flex flex-wrap items-center justify-center gap-2.5">{otherCategories.map((c) => (<CategoryPill key={c.slug} category={c} />))}</div>
                    </div>
                  </section>
                  <section className="mx-auto w-full max-w-6xl px-4 pb-20 sm:px-6">
                    {posts.length > 0 ? (<div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">{posts.map((post) => (<ArticleCard key={post.slug} post={post} />))}</div>) : (<p className="text-center text-muted-foreground">В этом разделе пока нет статей.</p>)}
                  </section>
                </main>
                <SiteFooter />
              </div>
            );
          }

          function BlogArticlePage() {
            const { slug } = useParams();
            const post = getPostBySlug(slug || "");
            if (!post) return <div className="p-20 text-center">Статья не найдена</div>;
            const category = getCategoryBySlug(post.categorySlug);
            const related = getRelatedPosts(post);
            if (!category) return null;
            return (
              <div className="min-h-dvh overflow-x-hidden">
                <BlogHeader />
                <main>
                  <section className="mx-auto w-full max-w-4xl px-4 pb-6 pt-6 sm:px-6 sm:pt-10">
                    <Breadcrumbs items={[{ label: "Блог", to: "/blog" }, { label: category.shortName, to: `/blog/category/${category.slug}` }, { label: post.title }]} />
                    <div className="mt-6"><CategoryPill category={category} /></div>
                    <h1 className="mt-4 text-3xl font-bold leading-[1.15] sm:text-4xl lg:text-[2.75rem]">{post.title}</h1>
                    <div className="mt-4 flex flex-wrap items-center gap-3 text-sm font-bold text-muted-foreground">
                      <span>FonteVita</span><span aria-hidden>·</span>
                      <time dateTime={post.publishedAt}>{formatDate(post.publishedAt)}</time>
                      <span aria-hidden>·</span>
                      <span className="flex items-center gap-1"><Clock className="h-4 w-4" />{post.readingTime} мин чтения</span>
                    </div>
                  </section>
                  <section className="mx-auto w-full max-w-4xl px-4 sm:px-6"><div className="soft-card overflow-hidden"><ArticleCover category={category} size="hero" /></div></section>
                  <section className="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 sm:py-14">
                    <div className="grid gap-10 lg:grid-cols-[minmax(0,1fr)_18rem]">
                      <div className="min-w-0 space-y-10">
                        <ArticleContent blocks={post.content} />
                        <ArticleFaq items={post.faq} />
                        {related.length > 0 && (<div><h2 className="text-2xl font-bold sm:text-3xl">Читайте также</h2><div className="mt-5 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">{related.map((p) => (<ArticleCard key={p.slug} post={p} />))}</div></div>)}
                      </div>
                      <aside className="space-y-5 lg:sticky lg:top-24 lg:h-fit">
                        <TableOfContents blocks={post.content} />
                        <RelatedProducts productIds={post.relatedProductIds} />
                      </aside>
                    </div>
                  </section>
                </main>
                <SiteFooter />
              </div>
            );
          }

          function App() {
            return (
              <>
                <ScrollToTop />
                <Routes>
                  <Route path="/" element={<HomePage />} />
                  <Route path="/blog" element={<BlogIndexPage />} />
                  <Route path="/blog/category/:category" element={<BlogCategoryPage />} />
                  <Route path="/blog/:slug" element={<BlogArticlePage />} />
                  <Route path="*" element={<HomePage />} />
                </Routes>
              </>
            );
          }

          export default App;
          APPEOF

          # Patch .asset.json files to use absolute Lovable CDN URLs
          for f in src/assets/*.asset.json; do
            sed -i 's|"url": "/__l5e/|"url": "https://fontevita-vitality-hub.lovable.app/__l5e/|g' "$f"
          done

          # Build with the SPA config
          bunx vite build --config vite.ghpages.config.ts 2>&1

      - name: Build Telegram Mini App
        run: |
          cd miniapp
          npm install
          npm run build
          cd ..
          mkdir -p dist-ghpages/miniapp
          cp -r miniapp/dist/* dist-ghpages/miniapp/
          echo "Mini app built and copied to dist-ghpages/miniapp/"

      - name: Prepare for GitHub Pages
        id: find
        run: |
          UPLOAD_DIR="dist-ghpages"
          if [ ! -f "$UPLOAD_DIR/index.html" ]; then
            echo "ERROR: No index.html in $UPLOAD_DIR"
            exit 1
          fi
          cp "$UPLOAD_DIR/index.html" "$UPLOAD_DIR/404.html"
          echo "upload_dir=$UPLOAD_DIR" >> $GITHUB_OUTPUT
          echo "Ready to deploy!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.upload_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
