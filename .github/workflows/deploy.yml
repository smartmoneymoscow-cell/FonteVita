              <meta name="twitter:description" content="Коллаген, магний + B6 и омега 3 в честных дозировках." />
              <meta name="twitter:image" content="https://fontevita-vitality-hub.lovable.app/__l5e/assets-v1/ace176ff-1b22-489c-a209-196f67f2c7b6/logo-mark.png" />
              <meta name="robots" content="index, follow" />
