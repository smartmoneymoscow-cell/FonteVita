              <meta property="og:title" content="FonteVita — витамины и БАДы для всей семьи" />
              <meta property="og:description" content="Коллаген, магний + B6 и омега 3 в честных дозировках. Сертифицированное качество FonteVita. Доставка по России." />
              <meta property="og:type" content="website" />
