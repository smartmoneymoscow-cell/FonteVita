              {"@context":"https://schema.org","@type":"Product","name":"FonteVita Магний + B6","brand":{"@type":"Brand","name":"FonteVita"},"offers":{"@type":"Offer","priceCurrency":"RUB","price":"1190","availability":"https://schema.org/InStock"},"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","reviewCount":"247"}}
