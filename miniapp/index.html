      html { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

      #preloader {
        position: fixed;
        inset: 0;

      }
      #preloader.fade-out {

      }
      #preloader img {
        width: 120px;
        height: auto;
        animation: preloader-float 2s ease-in-out infinite;
      }
      #preloader .donut {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 4px solid oklch(0.92 0.02 90);

        animation: preloader-spin 0.9s linear infinite;
      }

      @keyframes preloader-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
